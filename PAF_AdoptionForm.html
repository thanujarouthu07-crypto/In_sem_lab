<!DOCTYPE html>
<html>
<head>
    <title>Pet Adoption Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f4ef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 660px;
            background: white;
            padding: 45px 30px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #765238;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #765238;
        }

        /* Error message */
        #errorMessage {
            color: #e02020;
            text-align: center;
            font-size: 18px;
            margin: 5px 0 18px;
            display: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: lightcyan;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #75eeee;
        }

        .success {
            color: green;
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Pet Adoption Form</h1>

    <form id="adoptionForm">

        <label>Applicant Name</label>
        <input type="text" id="name"
               placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" id="email"
               placeholder="Enter your email">

        <label>Mobile Number</label>
        <input type="tel" id="mobile"
               placeholder="Enter your mobile number">

        <label>Address</label>
        <textarea id="address"
                  placeholder="Enter your complete address"></textarea>

        <label>Reason for Adoption</label>
        <textarea id="reason"
                  placeholder="Why do you want to adopt this pet?"></textarea>

        <!-- Error message like the 2nd image -->
        <p id="errorMessage">
            Please enter all the required details
        </p>

        <button type="submit">Send Application</button>

        <p id="successMessage" class="success"></p>

    </form>
</div>

<script>

    document.getElementById("adoptionForm").addEventListener("submit", function(event) {

        // Stop the form from submitting
        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let mobile = document.getElementById("mobile").value.trim();
        let address = document.getElementById("address").value.trim();
        let reason = document.getElementById("reason").value.trim();

        let errorMessage = document.getElementById("errorMessage");
        let successMessage = document.getElementById("successMessage");

        // Clear previous messages
        errorMessage.style.display = "none";
        successMessage.innerHTML = "";

        // Check empty fields
        if (name === "" || email === "" || mobile === "" ||
            address === "" || reason === "") {

            errorMessage.innerHTML =
                "Please enter all the required details";

            errorMessage.style.display = "block";

            return;
        }

        // Check email
        if (!email.includes("@")) {

            errorMessage.innerHTML =
                "Please enter a valid email address";

            errorMessage.style.display = "block";

            return;
        }

        // If everything is correct
        successMessage.innerHTML =
            "Application submitted successfully!";

    });

</script>

</body>
</html>
